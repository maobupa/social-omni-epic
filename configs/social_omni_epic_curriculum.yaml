# Config for scripts/run_curriculum.py
# Output goes to results/{run_name}/
#
# Resume example:
#   python scripts/run_curriculum.py run_name=my_run iterations=10
#   python scripts/run_curriculum.py run_name=my_run iterations=50   # continues from checkpoint

run_name: "run_001"

model: "openai/gpt-5-mini"
temperature: 1.0
learner_model: "openai/gpt-5-mini"
partner_model: "openai/gpt-5-mini"
evaluator_model: "openai/gpt-5-mini"

random_seed: 42

# How many generation attempts in this invocation
iterations: 10

# Concurrent episodes per batch (asyncio.gather)
batch_size: 4

# Stop when this many solved-after-biting scenarios exist across all runs (null = run all iterations)
stopping:
  N: 90

# Seed loading — 90 seeds, agent 0 as learner
seeds_path: "data/sotopia_90_seeds.jsonl"
seed_both_perspectives: false
seed_limit: null

# Episode controls
max_turns: 20
max_attempts: 4        # K: attempt 1 = biting failure, then up to K-1 reflection retries
chronicle_max_entries: 8

# Difficulty-calibration loop (Loop 1)
difficulty:
  D: 2
  re_gate_after_edit: true

# Rubric judge
judge:
  self_consistency_k: 3

# Task generator
use_verbalized_sampling: false
vs_num_candidates: 5
task_generator:
  num_examples: 3
  max_retries: 3
  num_episode_failed_examples: 2
  show_existing_types: true

# Model of Interestingness
enable_moi: true
moi:
  num_examples: 5
  min_archive_size: 10
  max_edits: 2

# Coherence gate
enable_coherence_check: true
coherence_max_retries: 2

# Diversity gate
enable_diversity_gate: true
diversity_similarity_threshold: 0.92

# Adversarial reflection check
adversarial:
  re_reflect_on_rejection: true

# Anchor selection: hierarchical Thompson Sampling — no tunable constants
# (priors inherited from parent posteriors at child creation)

hydra:
  run:
    dir: results/${run_name}
  output_subdir: hydra
