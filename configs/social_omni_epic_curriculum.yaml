# Config for scripts/run_curriculum.py
# Output goes to results/{run_name}/
#
# Resume example:
#   python scripts/run_curriculum.py run_name=my_run iterations=10
#   python scripts/run_curriculum.py run_name=my_run iterations=50   # continues from checkpoint

run_name: "run_001"

model: "openai/gpt-5-mini"
temperature: 1.0
learner_model: "openai/gpt-5-mini"
partner_model: "openai/gpt-5-mini"

random_seed: 1

# How many generation attempts in this invocation
iterations: 10

# Concurrent episodes per batch (asyncio.gather)
batch_size: 4

# Stop when this many frontier scenarios exist across all runs (null = run all iterations)
stopping:
  N: 90

# Seed loading — 90 seeds, agent 0 as learner (both_perspectives is permanently False)
seeds_path: "data/sotopia_90_seeds.jsonl"
seed_limit: null

# LP-initialized seeding from a phase0 ExpeL results dir (null = flat Beta(1,1) seeding).
# Carries per-seed classification + LP; classification drives the first operator; LP enters
# Thompson ONLY as a soft asymmetric prior (votes stay 0). Refuses to start if any seed lacks
# a classification unless allow_uncalibrated=true.
seed_from_phase0_dir: null
allow_uncalibrated: false
seed_prior:
  frontier_alpha: 2.0   # frontier seeds: mild optimism (lateral is the reliable frontier path)
  frontier_beta: 1.0
  default_alpha: 1.0    # too_easy / beyond_frontier / uncalibrated: flat (let child LP decide)
  default_beta: 1.0

# Cap on the warm-start prior mass a child inherits from its parent's posterior, so deep
# lineages stay responsive to their own first votes (mean preserved, mass capped).
child_prior_mass: 4.0

# Episode controls
max_turns: 20
max_attempts: 4        # K: attempt 1 → too_easy check; 2..K → reflection + retry
# Memory mechanism in the K-loop. true (default) = ExpeL within-episode Reflexion strings
# (no Skills Chronicle / adversarial / meta-reflection). false = legacy Skills Chronicle path.
use_expel_memory: true
chronicle_max_entries: 8   # chronicle path only

# LP judge — MUST be a different provider than the learner (cross-lab; asserted at startup).
# Matches the phase0 Base90 ExpeL run for protocol parity.
judge:
  model: "google/gemini-3-flash-preview"
  lp_temperature: 0.3

# Task generator — batch + rank
gen_batch_size: 3              # candidates per generation call → MOI ranker picks 1
mechanism_library: default     # use MECHANISM_LIBRARY from data_models.py
task_generator:
  num_examples: 3
  max_retries: 3
  num_episode_failed_examples: 2
  show_existing_types: true

# Model of Interestingness (worth-only ranker; no gate)
enable_moi: true
moi:
  num_examples: 5

# Coherence gate
enable_coherence_check: true
coherence_max_retries: 2
coherence:
  quarantine_on_error: true

# Diversity gate (cosine dedup)
enable_diversity_gate: true
diversity_similarity_threshold: 0.92

# Niche assignment
niches:
  refit_every: 10

# Adversarial reflection check
adversarial:
  re_reflect_on_rejection: true

# Anchor selection: Thompson Sampling over LP pseudo-vote posteriors.
# All tasks (too_easy / frontier / beyond_frontier) are selectable anchors.
# Mutation operator is chosen based on anchor.classification:
#   too_easy        → escalate
#   frontier        → lateral
#   beyond_frontier → relax
#
# anchor_selection: "thompson" (default) | "random" (DOF-1 ablation baseline — uniform anchor
# selection, posteriors ignored for selection but still recorded). Override on the CLI:
#   python scripts/run_curriculum.py run_name=gen90_random anchor_selection=random ...
# Compare the random bank vs the thompson bank on INTRINSIC metrics only (frontier-yield,
# coverage); do not downstream-eval it. See docs/post_run_experiments.md.
anchor_selection: thompson

hydra:
  run:
    dir: results/${run_name}
  output_subdir: hydra
