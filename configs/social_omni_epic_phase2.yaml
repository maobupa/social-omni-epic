# Config for scripts/run_phase2.py (Phase 2: Skills Chronicle + Reflection loop).
# Run:  python scripts/run_phase2.py
#       python scripts/run_phase2.py run_mode=phase0
run_mode: "phase2"     # phase0 | phase2

model: "openai/gpt-5-mini"
temperature: 1.0

# Episode-time models
learner_model: "openai/gpt-5-mini"
partner_model: "openai/gpt-5-mini"
evaluator_model: "openai/gpt-5-mini"

iterations: 200
checkpoint_every: 25
random_seed: 42
checkpoint_dir: "output/phase2_full"
archive_from_ckpt: null   # e.g. "output/phase1_full/archive_latest.json"

# Episode controls
goal_threshold: 7.0   # legacy/mock fallback only; the success gate is the rubric (AND of checks)
max_turns: 20

# Multi-attempt (reflection) controls — K = skill-learning episode attempts
max_attempts: 4       # K: attempt 1 is the biting failure, then up to 3 reflection-driven retries (3 chronicle edits)
chronicle_max_entries: 8   # max entries shown to agent per attempt

# Difficulty-calibration loop (Loop 1): ratchet a too-easy scenario up until it bites
difficulty:
  D: 2                # max difficulty edits (≤3 scenario versions) before discarding an unbiteable scenario
  re_gate_after_edit: true

# Rubric judges
judge:
  self_consistency_k: 3   # partner-perspective check: K samples, majority vote (neutral check is single-pass)

# Stopping (ANNECS-style): stop once N solved-after-biting scenarios exist (null = run all iterations)
stopping:
  N: null

# Anchor selection: hierarchical Thompson Sampling (§4.1)
# No tunable constants — priors are inherited from parent posteriors at child creation.

# Task generator
use_verbalized_sampling: false
vs_num_candidates: 5

# Seed loading
seeds_path: "data/sotopia_90_seeds.jsonl"
seed_both_perspectives: true
seed_limit: null

task_generator:
  num_examples: 3
  max_retries: 3
  example_strategy: "knn"
  show_existing_types: true

moi:
  num_examples: 5
  min_archive_size: 10
  max_edits: 2   # MoI auditor+editor: edit-up attempts before discarding (else regenerate next iter)

use_archive: true
enable_moi: true
enable_coherence_check: true
coherence_max_retries: 2
enable_diversity_gate: true
diversity_similarity_threshold: 0.92

# Adversarial agent
adversarial:
  re_reflect_on_rejection: true   # call reflect_with_critique when adv rejects

hydra:
  run:
    dir: ${checkpoint_dir}
  output_subdir: hydra
